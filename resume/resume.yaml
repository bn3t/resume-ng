basics:
  name: Bernard Niset
  label: Senior Java Developer & Tech Lead — Fullstack (Freelance)
  summary: |
    Senior Java Developer and Technical Lead with more than 20 years of experience 
    building backend services on the Java platform (Java EE, Spring, Spring Boot, 
    Hibernate), plus solid frontend experience in Angular and ReactJS.
    I have led and coached Java development teams, made architecture and technical
    decisions, reviewed code and worked closely with business stakeholders
    and Product Owners to turn requirements into maintainable software.

    Quality matters to me: systematic unit testing, integration testing
    with Cypress and Playwright, code reviews and secure coding practices.

    ### Specialties

    Java, Spring Boot, Spring Security, Hibernate, Java EE, SOAP and REST 
    web services, ActiveMQ, Microsoft SQL Server and Oracle. Delivery with Maven, 
    Jenkins, Git, Docker and Kubernetes. Frontend with Angular, ReactJS and TypeScript.
  phone: +32 479 529 195
  email: bn@smartobjects.be
  location:
    address: Clos du Parnasse, 13 / 19
    postalCode: "1050"
    city: Brussels
    countryCode: Belgium
  website: https://www.smartobjects.be
  profiles:
