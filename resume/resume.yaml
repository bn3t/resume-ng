work:
  - company: "Office National de l'Emploi"
    disposition: current
    position: Senior Fullstack Developer
    description: Tech lead role, Java/Kotlin, Spring Boot and Angular
    website: "https://www.onem.be"
    startDate: "2024-04-01"
    methodology: Agile/Scrum
    summary: >-
      Senior developer with a technical lead role on the unemployment eligibility
      applications of the [Office National de l'Emploi](https://www.onem.be).
      Responsible for the technical side of the application. Implement the complex
      rules that decide who is eligible and at which unemployment benefit rate.
    highlights:
      - >-
        Make the architecture decisions: hexagonal architecture with anti-corruption
        layers keeps the business logic apart from external systems. Backend in
        Java/Kotlin with Spring Boot, frontend features in Angular.
      - >-
        Review code in a Scrum team of two to three developers and coach a junior
        developer closely.
      - >-
        Give Spring training to colleagues and share know-how on Java, Kotlin,
        Maven, OpenShift and Helm.
      - >-
        The team has the smallest budget in hours, yet delivers among the most.
      - >-
        Stable, maintainable application: very few production errors and CI tests
        that don't randomly fail.
      - >-
        Since 2026, more involved in refinement, functional analysis and UX
        preparation, so requirements are clearer before development starts.
    technologies:
      - angular
